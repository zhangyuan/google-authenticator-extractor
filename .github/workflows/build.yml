name: Build

on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: google_authenticator_extractor

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-11-arm, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (release)
        run: cargo build --release
      - name: Run tests
        run: cargo test
      - name: Determine artifact name
        id: meta
        shell: bash
        run: |
          set -e
          case "${{ runner.os }}" in
            Windows*) EXT=.exe ; ARCH=$(echo $PROCESSOR_ARCHITECTURE || echo unknown) ;;
            *) EXT= ; ARCH=$(uname -m) ;;
          esac
          echo "ext=$EXT" >> $GITHUB_OUTPUT
          echo "arch=$ARCH" >> $GITHUB_OUTPUT
          echo "os=${{ matrix.os }}" >> $GITHUB_OUTPUT
      - name: Package binary (posix)
        if: runner.os != 'Windows'
        run: |
          set -e
          BIN_NAME="${BINARY_NAME}${{ steps.meta.outputs.ext }}"
          SRC=target/release/${BIN_NAME}
          mkdir -p dist
          cp "${SRC}" "dist/${BIN_NAME}-${{ steps.meta.outputs.os }}-${{ steps.meta.outputs.arch }}"
          chmod +x "dist/${BIN_NAME}-${{ steps.meta.outputs.os }}-${{ steps.meta.outputs.arch }}"

      - name: Package binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = "${{ env.BINARY_NAME }}${{ steps.meta.outputs.ext }}"
          $src = "target\release\$bin"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item -Path $src -Destination dist
          $base = [IO.Path]::GetFileNameWithoutExtension($bin)
          $newName = "$($base)-${{ steps.meta.outputs.os }}-${{ steps.meta.outputs.arch }}.exe"
          if (Test-Path (Join-Path dist $bin)) { Rename-Item -Path (Join-Path dist $bin) -NewName $newName -Force }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.os }}-${{ steps.meta.outputs.arch }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release and upload assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: dist/**
          overwrite: true
          file_glob: true
