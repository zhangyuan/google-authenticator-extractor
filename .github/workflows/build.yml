name: Build

on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: google_authenticator_extractor

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-11-arm, windows-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - name: Build (release)
        run: cargo build --release
      - name: Run tests
        run: cargo test
      - name: Determine artifact name
        id: meta
        run: |
          set -e
          case "${{ runner.os }}" in
            Windows*) EXT=.exe ; ARCH=$(echo $PROCESSOR_ARCHITECTURE || echo unknown) ;;
            *) EXT= ; ARCH=$(uname -m) ;;
          esac
          echo "ext=$EXT" >> $GITHUB_OUTPUT
          echo "arch=$ARCH" >> $GITHUB_OUTPUT
          echo "os=${{ matrix.os }}" >> $GITHUB_OUTPUT
      - name: Package binary
        run: |
          set -e
          BIN_NAME="${BINARY_NAME}${{ steps.meta.outputs.ext }}"
          SRC=target/release/${BIN_NAME}
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Copy-Item -Path $Env:RUNNER_WORKSPACE\${{ github.repository }}\target\release\${BIN_NAME} -Destination dist -ErrorAction SilentlyContinue"
            pushd dist
            powershell -Command "Compress-Archive -Path ${BIN_NAME} -DestinationPath ${BIN_NAME%.*}-${{ steps.meta.outputs.os }}-${{ steps.meta.outputs.arch }}.zip -Force"
            popd
          else
            cp "$SRC" dist/
            tar -czf "dist/${BIN_NAME}-${{ steps.meta.outputs.os }}-${{ steps.meta.outputs.arch }}.tar.gz" -C dist "$BIN_NAME" || true
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ steps.meta.outputs.arch }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create GitHub Release and upload assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          file: dist/**
          overwrite: true
          file_glob: true
